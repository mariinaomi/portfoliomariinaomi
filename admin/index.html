<!-- PRIMEIRA COISA DO SCRIPT: conferir a sessão. Sem sessão, vai para o login.
     A página só aparece (tira o "oculto") depois dessa conferência. -->
<script>
(function () {
  'use strict';
  var LOGIN = '../login/';
  function mostrar() { document.documentElement.classList.remove('oculto'); }

  window.PRONTO = new Promise(function (resolve) {
    if (!window.banco) {
      /* Sem Supabase (internet caiu): mostra a página com um aviso, nunca em branco. */
      mostrar();
      window.SEM_BANCO = true;
      resolve(null);
      return;
    }
    window.banco.auth.getSession().then(function (r) {
      var sessao = r && r.data && r.data.session;
      if (!sessao) { location.replace(LOGIN); return; }
      window.SESSAO = sessao;
      mostrar();
      resolve(sessao);
    }).catch(function () { location.replace(LOGIN); });

    /* Se sair em outra aba ou a sessão vencer, volta para o login. */
    window.banco.auth.onAuthStateChange(function (evento) {
      if (evento === 'SIGNED_OUT') location.replace(LOGIN);
    });
  });
})();
</script>
